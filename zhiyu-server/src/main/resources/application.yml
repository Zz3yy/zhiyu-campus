spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      # Keep bounded uploads in memory; do not spool images or recordings to disk.
      file-size-threshold: 6MB
  application:
    name: zhiyu-server
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:zhiyu}
    username: ${POSTGRES_USER:zhiyu}
    password: ${POSTGRES_PASSWORD:zhiyu_local_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    baseline-on-migrate: true
server:
  port: ${SERVER_PORT:8080}
ai:
  vision:
    # Reuse chat's model when it supports image input; optionally select another Ark model.
    model: ${ARK_VISION_MODEL:${ARK_MODEL:}}
    request-timeout-ms: ${ARK_VISION_REQUEST_TIMEOUT_MS:40000}
  speech:
    api-key: ${VOLC_SPEECH_API_KEY:}
    app-id: ${VOLC_SPEECH_APP_ID:}
    access-token: ${VOLC_SPEECH_ACCESS_TOKEN:}
    endpoint: ${VOLC_SPEECH_ENDPOINT:https://openspeech.bytedance.com/api/v3/auc/bigmodel/recognize/flash}
    request-timeout-ms: ${VOLC_SPEECH_REQUEST_TIMEOUT_MS:30000}
  service-url: ${AI_SERVICE_URL:http://localhost:8000}
  doubao:
    api-key: ${ARK_API_KEY:}
    model: ${ARK_MODEL:}
    base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    # Keep provider waits bounded while allowing slower tool-enabled model replies.
    connect-timeout-ms: ${ARK_CONNECT_TIMEOUT_MS:8000}
    request-timeout-ms: ${ARK_REQUEST_TIMEOUT_MS:40000}
    workflow-timeout-ms: ${ARK_WORKFLOW_TIMEOUT_MS:100000}
