# Public HTTP entry for IP access; backend and database stay on loopback.
limit_req_zone $binary_remote_addr zone=zhiyu_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=zhiyu_connections:10m;

server {
    listen 80;
    listen 127.0.0.1:8088;
    server_name _;
    root /opt/zhiyu/current/web;
    index index.html;
    server_tokens off;

    client_max_body_size 6m;
    client_body_buffer_size 6m;
    client_body_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn zhiyu_connections 20;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        limit_req zone=zhiyu_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        # Preserve SSE status/delta events and keep uploads out of temp files.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 125s;
        proxy_send_timeout 125s;
        gzip off;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
