services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zhiyu-postgres
    environment:
      POSTGRES_DB: zhiyu
      POSTGRES_USER: zhiyu
      POSTGRES_PASSWORD: zhiyu_local_password
    ports:
      - "5432:5432"
    volumes:
      - zhiyu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiyu -d zhiyu"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zhiyu-redis
    ports:
      - "6379:6379"
    volumes:
      - zhiyu-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  zhiyu-postgres-data:
  zhiyu-redis-data:
